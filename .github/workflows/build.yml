name: Build Frappe Production Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Checkout Frappe Docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Validate apps.json
        shell: bash
        run: python -m json.tool apps.json >/dev/null

      - name: Patch layered Containerfile for stable apps manifest
        shell: bash
        run: |
          set -euo pipefail
          file="frappe_docker/images/layered/Containerfile"

          python - <<'PY'
          from pathlib import Path

          p = Path("frappe_docker/images/layered/Containerfile")
          lines = p.read_text().splitlines()
          out = []
          in_run = False
          for line in lines:
              if line.startswith("RUN --mount=type=secret,id=apps_json"):
                  in_run = True
                  out.append('RUN --mount=type=secret,id=apps_json,target=/run/secrets/apps_json,uid=1000,gid=1000 \\')
                  out.append('  : "${CACHE_BUST}" && \\')
                  out.append('  cp /run/secrets/apps_json /tmp/apps.json && \\')
                  out.append('  python -m json.tool /tmp/apps.json >/dev/null && \\')
                  out.append('  test -s /tmp/apps.json && \\')
                  out.append('  bench init --apps_path=/tmp/apps.json \\')
                  continue
              if in_run:
                  if "/home/frappe/frappe-bench" in line:
                      out.append('    /home/frappe/frappe-bench && \\')
                      out.append('  rm -f /tmp/apps.json && \\')
                      in_run = False
                  continue
              out.append(line)
          text = "\n".join(out) + "\n"
          if "--apps_path=/tmp/apps.json" not in text:
              raise SystemExit("Failed to install apps_path patch")
          p.write_text(text)
          PY

          grep -q -- '--apps_path=/tmp/apps.json' "$file"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/frappe-custom:16
            ghcr.io/${{ steps.image.outputs.owner }}/frappe-custom:16.${{ github.run_number }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}
          secrets: |
            apps_json=apps.json
          cache-from: type=gha,scope=frappe-production
          cache-to: type=gha,mode=max,scope=frappe-production
