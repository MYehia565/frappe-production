name: Build Frappe Production Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Checkout Frappe Docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Validate apps.json
        shell: bash
        run: python -m json.tool apps.json >/dev/null

      - name: Patch layered Containerfile for CI secret handling
        shell: bash
        run: |
          set -euo pipefail
          file="frappe_docker/images/layered/Containerfile"

          # Keep the BuildKit secret away from /opt/frappe. Bench may recreate
          # or modify files under /opt/frappe while initializing the bench.
          sed -i 's#target=/opt/frappe/apps.json#target=/tmp/frappe-apps.json#g' "$file"
          sed -i 's#/opt/frappe/apps.json#/tmp/frappe-apps.json#g' "$file"

          # The upstream --verbose flag creates an enormous GitHub Actions log
          # during Yarn installation without adding useful build diagnostics.
          sed -i '/^[[:space:]]*--verbose \\$/d' "$file"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/frappe-custom:16
            ghcr.io/${{ steps.image.outputs.owner }}/frappe-custom:16.${{ github.run_number }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}
          secrets: |
            apps_json=apps.json
          cache-from: type=gha,scope=frappe-production
          cache-to: type=gha,mode=max,scope=frappe-production
