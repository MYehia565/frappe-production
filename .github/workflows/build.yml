name: Build Frappe Production Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Checkout Frappe Docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Validate apps.json
        shell: bash
        run: python -m json.tool apps.json >/dev/null

      - name: Patch layered Containerfile for stable apps manifest
        shell: bash
        run: |
          set -euo pipefail
          file="frappe_docker/images/layered/Containerfile"

          python - <<'PY'
          from pathlib import Path

          p = Path("frappe_docker/images/layered/Containerfile")
          s = p.read_text()

          old = """RUN --mount=type=secret,id=apps_json,target=/opt/frappe/apps.json,uid=1000,gid=1000 \\\n  : "${CACHE_BUST}" && \\\n  export APP_INSTALL_ARGS="" && \\\n  if [ -f /opt/frappe/apps.json ] && [ -s /opt/frappe/apps.json ]; then \\\n    export APP_INSTALL_ARGS="--apps_path=/opt/frappe/apps.json"; \\\n  fi && \\\n  bench init ${APP_INSTALL_ARGS} \\\n"""

          new = """RUN --mount=type=secret,id=apps_json,target=/run/secrets/apps_json,uid=1000,gid=1000 \\\n  : "${CACHE_BUST}" && \\\n  cp /run/secrets/apps_json /tmp/apps.json && \\\n  python -m json.tool /tmp/apps.json >/dev/null && \\\n  test -s /tmp/apps.json && \\\n  bench init --apps_path=/tmp/apps.json \\\n"""

          if old not in s:
              raise SystemExit("Expected upstream Containerfile block not found; refusing unsafe patch")

          s = s.replace(old, new, 1)
          s = s.replace("    --verbose \\\n", "", 1)
          p.write_text(s)
          PY

          grep -q -- '--apps_path=/tmp/apps.json' "$file"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/frappe-custom:16
            ghcr.io/${{ steps.image.outputs.owner }}/frappe-custom:16.${{ github.run_number }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}
          secrets: |
            apps_json=apps.json
          cache-from: type=gha,scope=frappe-production
          cache-to: type=gha,mode=max,scope=frappe-production
