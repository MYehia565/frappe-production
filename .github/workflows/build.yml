name: Build Frappe Production Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Checkout Frappe Docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Validate apps.json
        shell: bash
        run: python -m json.tool apps.json >/dev/null

      - name: Verify apps.json is non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s apps.json
          python - <<'PY'
          import json
          from pathlib import Path
          apps = json.loads(Path("apps.json").read_text())
          assert isinstance(apps, list) and apps, "apps.json must contain a non-empty list"
          print(f"Validated {len(apps)} app definitions")
          PY

      - name: Reduce Frappe build log volume
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*--verbose[[:space:]]*\\$/d' frappe_docker/images/layered/Containerfile
          if grep -q -- '--verbose' frappe_docker/images/layered/Containerfile; then
            echo "Unexpected verbose flag remains"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/frappe-custom:16
            ghcr.io/${{ steps.image.outputs.owner }}/frappe-custom:16.${{ github.run_number }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}
          secret-files: |
            apps_json=apps.json
          cache-from: type=gha,scope=frappe-production
          cache-to: type=gha,mode=max,scope=frappe-production
